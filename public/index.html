<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARMM - Productos de Limpieza</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <h2>ARMM <span>Limpieza</span></h2>
    </div>

    <div class="header-right">
      <button id="btn-carrito" class="btn-icon" onclick="toggleCarrito()">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-count">0</span>
      </button>

      <div id="auth-container">
        <div id="auth-buttons">
          <button id="btn-login" class="btn-auth" onclick="abrirMenuAuth('login')">Iniciar Sesión</button>
          <button id="btn-register" class="btn-auth" onclick="abrirMenuAuth('registro')">Registrarse</button>
        </div>

        <div id="user-profile" style="display: none;">
          <button id="btn-user-menu" class="btn-user">
            <i class="fas fa-user-circle"></i>
            <span id="user-display-name">Usuario</span>
          </button>
          <button class="btn-logout" onclick="cerrarSesion()" title="Cerrar Sesión">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <aside id="menu-registro" class="sliding-menu">
    <div class="menu-header">
      <h3 id="menu-titulo">Registro de Usuario</h3>
      <button class="btn-close" onclick="cerrarMenuAuth()">&times;</button>
    </div>

    <form id="form-registro" onsubmit="procesarRegistro(event)">
      <div class="form-group">
        <label for="reg-nombre">Nombre</label>
        <input type="text" id="reg-nombre" required placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label for="reg-apellido">Apellido</label>
        <input type="text" id="reg-apellido" required placeholder="Tu apellido">
      </div>

      <div class="form-group">
        <label for="reg-telefono">Teléfono</label>
        <input type="tel" id="reg-telefono" required placeholder="Ej. 3312345678">
      </div>

      <div class="form-group">
        <label for="reg-correo">Correo Electrónico</label>
        <input type="email" id="reg-correo" required placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="reg-pass">Contraseña</label>
        <div class="input-with-icon">
          <input type="password" id="reg-pass" required placeholder="Crea tu contraseña">
          <i class="fas fa-eye toggle-password" onclick="toggleVerPassword('reg-pass', this)"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-confirm-pass">Confirmar Contraseña</label>
        <div class="input-with-icon">
          <input type="password" id="reg-confirm-pass" required placeholder="Confirma tu contraseña">
          <i class="fas fa-eye toggle-password" onclick="toggleVerPassword('reg-confirm-pass', this)"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit">Registrarse</button>
    </form>

    <form id="form-login" style="display: none;" onsubmit="procesarLogin(event)">
      <div class="form-group">
        <label for="login-identificador">Correo o Teléfono</label>
        <input type="text" id="login-identificador" required placeholder="Correo o número registrado">
      </div>

      <div class="form-group">
        <label for="login-pass">Contraseña</label>
        <div class="input-with-icon">
          <input type="password" id="login-pass" required placeholder="Ingresa tu contraseña">
          <i class="fas fa-eye toggle-password" onclick="toggleVerPassword('login-pass', this)"></i>
        </div>
      </div>

      <div class="form-group-forgot">
        <a href="#" onclick="alert('Se enviaron las instrucciones a tu correo/teléfono.')">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-submit">Iniciar Sesión</button>
    </form>
  </aside>

  <aside id="panel-carrito" class="sliding-menu">
    <div class="menu-header">
      <h3><i class="fas fa-shopping-cart"></i> Tu Carrito</h3>
      <button class="btn-close" onclick="toggleCarrito()">&times;</button>
    </div>

    <div id="carrito-items-lista" class="carrito-body">
      <p class="carrito-vacio">El carrito está vacío.</p>
    </div>

    <div class="carrito-resumen">
      <div class="subtotal">
        <span>Total:</span>
        <strong id="carrito-total-precio">$0.00</strong>
      </div>
      <button class="btn-checkout" onclick="procesarPedido()">Proceder al Pago</button>
    </div>
  </aside>

  <main class="main-content">
    <section class="admin-section">
      <h2>Catálogo Completo de Productos</h2>
      <div class="tabla-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Categoría</th>
              <th>Producto</th>
              <th>20L / Mayoreo</th>
              <th>5L / Menudeo</th>
              <th>1L</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-productos-body">
            </tbody>
        </table>
      </div>
    </section>

    <section class="admin-section">
      <h2>Usuarios Registrados</h2>
      <div class="tabla-container">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Teléfono</th>
              <th>Correo</th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios-body">
            </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
