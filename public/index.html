<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - ARMM</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-green: #00e676;
            --accent-hover: #00c853;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --danger-color: #f85149;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            color: var(--accent-green);
            margin-bottom: 30px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 12px 15px;
            text-align: left;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
        }

        .badge {
            background-color: var(--danger-color);
            color: white;
            font-size: 0.75rem;
            padding: 2px 7px;
            border-radius: 12px;
            font-weight: bold;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Cards & Container Styles */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 0;
            color: var(--accent-green);
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-green);
            margin-top: 10px;
        }

        /* Chats Section Layout */
        .chats-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            height: 500px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .chat-list {
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .chat-user-item {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-user-item:hover, .chat-user-item.active {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .chat-user-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .chat-user-last-msg {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-messages-area {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .messages-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            padding-right: 10px;
        }

        .message-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message-bubble.client {
            background-color: #21262d;
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }

        .message-bubble.admin {
            background-color: var(--accent-green);
            color: #000;
            align-self: flex-end;
            font-weight: 500;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            outline: none;
        }

        button.btn-send {
            background-color: var(--accent-green);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button.btn-send:hover {
            background-color: var(--accent-hover);
        }

        /* Notifications List */
        .notification-item {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notification-item .time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Menú Lateral -->
    <div class="sidebar">
        <h2>ARMM Panel</h2>
        <button class="nav-btn active" onclick="switchSection('dashboard')">Dashboard</button>
        <button class="nav-btn" onclick="switchSection('chats')">
            Chats <span id="chatBadge" class="badge" style="display:none;">0</span>
        </button>
        <button class="nav-btn" onclick="switchSection('notifications')">
            Notificaciones <span id="notifBadge" class="badge" style="display:none;">0</span>
        </button>
    </div>

    <!-- Área Principal -->
    <div class="main-content">

        <!-- DASHBOARD SECTION -->
        <div id="dashboard" class="section active">
            <h2>Panel de Control</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div>Visualizaciones del Sitio</div>
                    <div id="siteViews" class="stat-number">0</div>
                </div>
                <div class="stat-card">
                    <div>Usuarios Registrados</div>
                    <div id="userCount" class="stat-number">0</div>
                </div>
                <div class="stat-card">
                    <div>Mensajes Recibidos</div>
                    <div id="msgCount" class="stat-number">0</div>
                </div>
            </div>
        </div>

        <!-- CHATS SECTION (Centro de Ayuda Directa) -->
        <div id="chats" class="section">
            <h2>Chats de Ayuda Directa</h2>
            <div class="chats-container">
                <div id="chatList" class="chat-list">
                    <!-- Lista de clientes dinámica -->
                </div>
                <div class="chat-messages-area">
                    <div id="messagesBox" class="messages-box">
                        <p style="color: var(--text-muted); text-align: center; margin-top: 50%;">Selecciona un cliente para ver la conversación.</p>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="adminMsgInput" placeholder="Escribe una respuesta..." disabled>
                        <button class="btn-send" onclick="sendAdminMessage()" disabled id="btnSend">Enviar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- NOTIFICATIONS SECTION -->
        <div id="notifications" class="section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Registro de Notificaciones</h2>
                <button onclick="requestNotificationPermission()" class="btn-send">Activar Notificaciones de Escritorio</button>
            </div>
            <div class="card" id="notificationsList">
                <p style="color: var(--text-muted);">No hay notificaciones recientes.</p>
            </div>
        </div>

    </div>

    <script>
        let selectedClientId = null;

        // Inicialización y Carga de Datos al Abrir
        document.addEventListener('DOMContentLoaded', () => {
            initData();
            renderDashboard();
            renderChats();
            renderNotifications();
            listenToStorageEvents();
        });

        // Activar Notificaciones del Navegador (Fuera de la Web)
        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("Notificaciones del navegador activadas correctamente.");
                    }
                });
            } else {
                alert("Este navegador no soporta notificaciones de escritorio.");
            }
        }

        // Lanza la Notificación fuera de la Web (Sistema Operativo)
        function triggerDesktopNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, {
                    body: body,
                    icon: "https://armm-app.onrender.com/favicon.ico"
                });
            }
        }

        // Inicializar LocalStorage si está vacío
        function initData() {
            if (!localStorage.getItem('armm_views')) localStorage.setItem('armm_views', '0');
            if (!localStorage.getItem('armm_users')) localStorage.setItem('armm_users', JSON.stringify([]));
            if (!localStorage.getItem('armm_chats')) localStorage.setItem('armm_chats', JSON.stringify({}));
            if (!localStorage.getItem('armm_notifications')) localStorage.setItem('armm_notifications', JSON.stringify([]));
        }

        // Escuchador de Sincronización en Tiempo Real
        function listenToStorageEvents() {
            window.addEventListener('storage', (e) => {
                // Se ejecuta cuando el cliente realiza acciones desde la otra pestaña de la tienda
                if (['armm_views', 'armm_users', 'armm_chats', 'armm_notifications'].includes(e.key)) {
                    renderDashboard();
                    renderChats();
                    renderNotifications();

                    // Detectar si fue una nueva notificación para alertar fuera de la web
                    if (e.key === 'armm_notifications') {
                        const notifs = JSON.parse(e.newValue || '[]');
                        if (notifs.length > 0) {
                            const latest = notifs[0];
                            triggerDesktopNotification(latest.title, latest.message);
                        }
                    }
                }
            });
        }

        // Agregar Notificación al Registro Global e Historial
        function addNotification(title, message) {
            let notifs = JSON.parse(localStorage.getItem('armm_notifications') || '[]');
            const newNotif = {
                id: Date.now(),
                title: title,
                message: message,
                timestamp: new Date().toLocaleTimeString()
            };
            notifs.unshift(newNotif);
            localStorage.setItem('armm_notifications', JSON.stringify(notifs));
            
            renderNotifications();
            triggerDesktopNotification(title, message);
        }

        // Renderizar Métricas del Dashboard
        function renderDashboard() {
            const views = localStorage.getItem('armm_views') || '0';
            const users = JSON.parse(localStorage.getItem('armm_users') || '[]');
            const chats = JSON.parse(localStorage.getItem('armm_chats') || '{}');

            let totalMsgs = 0;
            Object.values(chats).forEach(chat => {
                totalMsgs += chat.messages ? chat.messages.length : 0;
            });

            document.getElementById('siteViews').innerText = views;
            document.getElementById('userCount').innerText = users.length;
            document.getElementById('msgCount').innerText = totalMsgs;
        }

        // Renderizar Lista de Chats (Centro de Ayuda Directa)
        function renderChats() {
            const chats = JSON.parse(localStorage.getItem('armm_chats') || '{}');
            const chatListEl = document.getElementById('chatList');
            chatListEl.innerHTML = '';

            const clientIds = Object.keys(chats);

            if (clientIds.length === 0) {
                chatListEl.innerHTML = '<p style="padding: 15px; color: var(--text-muted);">Sin chats activos.</p>';
                return;
            }

            clientIds.forEach(id => {
                const chat = chats[id];
                const lastMsg = chat.messages && chat.messages.length > 0 
                    ? chat.messages[chat.messages.length - 1].text 
                    : 'Sin mensajes';

                const item = document.createElement('div');
                item.className = `chat-user-item ${selectedClientId === id ? 'active' : ''}`;
                item.onclick = () => selectChat(id);
                item.innerHTML = `
                    <div class="chat-user-name">${chat.userName || 'Cliente ' + id}</div>
                    <div class="chat-user-last-msg">${lastMsg}</div>
                `;
                chatListEl.appendChild(item);
            });

            if (selectedClientId) {
                renderMessages(selectedClientId);
            }
        }

        // Seleccionar un cliente para desglosar el chat
        function selectChat(clientId) {
            selectedClientId = clientId;
            document.getElementById('adminMsgInput').disabled = false;
            document.getElementById('btnSend').disabled = false;
            
            renderChats();
            renderMessages(clientId);
        }

        // Renderizar Historial de Mensajes de un Cliente
        function renderMessages(clientId) {
            const chats = JSON.parse(localStorage.getItem('armm_chats') || '{}');
            const chat = chats[clientId];
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';

            if (chat && chat.messages) {
                chat.messages.forEach(msg => {
                    const bubble = document.createElement('div');
                    bubble.className = `message-bubble ${msg.sender}`;
                    bubble.innerText = msg.text;
                    box.appendChild(bubble);
                });
                box.scrollTop = box.scrollHeight;
            }
        }

        // Enviar respuesta desde el Admin al cliente
        function sendAdminMessage() {
            const input = document.getElementById('adminMsgInput');
            const text = input.value.trim();
            if (!text || !selectedClientId) return;

            let chats = JSON.parse(localStorage.getItem('armm_chats') || '{}');
            if (!chats[selectedClientId]) return;

            chats[selectedClientId].messages.push({
                sender: 'admin',
                text: text,
                time: new Date().toLocaleTimeString()
            });

            localStorage.setItem('armm_chats', JSON.stringify(chats));
            input.value = '';
            renderMessages(selectedClientId);
        }

        // Renderizar la Sección de Notificaciones
        function renderNotifications() {
            const notifs = JSON.parse(localStorage.getItem('armm_notifications') || '[]');
            const container = document.getElementById('notificationsList');

            if (notifs.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">No hay notificaciones recientes.</p>';
                return;
            }

            container.innerHTML = notifs.map(n => `
                <div class="notification-item">
                    <div>
                        <strong>${n.title}</strong>
                        <div>${n.message}</div>
                    </div>
                    <span class="time">${n.timestamp}</span>
                </div>
            `).join('');
        }

        // Cambiar entre Pestañas del Panel
        function switchSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
