<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARMM LIMPIEZA - Catálogo Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0b131e;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b131e;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00ff88;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-[#070c14] border-b border-slate-800/80 sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-black tracking-tight text-white">ARMM</span>
        <span class="text-2xl font-black tracking-tight text-[#00ff88]">LIMPIEZA</span>
      </div>

      <button class="bg-[#00ff88] hover:bg-[#00e676] text-slate-950 font-extrabold px-5 py-2 rounded-full text-sm flex items-center space-x-2 shadow-md shadow-[#00ff88]/10 transition transform active:scale-95">
        <i data-lucide="shopping-cart" class="w-4 h-4"></i>
        <span>Carrito</span>
        <span id="cart-count" class="bg-slate-950 text-[#00ff88] text-xs px-2 py-0.5 rounded-full ml-1">0</span>
      </button>
    </div>
  </header>

  <main class="flex-grow">
    <section class="py-10 px-4 text-center max-w-4xl mx-auto space-y-4">
      <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight">
        Catálogo de Productos Químicos y Jarciería
      </h1>
      <p class="text-slate-400 text-sm max-w-2xl mx-auto">
        Encuentra soluciones de limpieza industrial y hogar a los mejores precios por litro o mayoreo.
      </p>

      <div class="relative max-w-xl mx-auto pt-3">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Buscar producto (ej. Cloro, Detergente)..." 
          class="w-full bg-[#141e2d] border border-slate-700/60 rounded-xl px-11 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#00ff88] focus:ring-1 focus:ring-[#00ff88] transition"
          oninput="renderProducts()"
        >
        <i data-lucide="search" class="w-5 h-5 text-slate-500 absolute left-3.5 top-6"></i>
      </div>
    </section>

    <section class="max-w-7xl mx-auto px-4 mb-8">
      <div class="flex space-x-2 overflow-x-auto pb-3 pt-1 no-scrollbar justify-start md:justify-center" id="categories-container">
        </div>
    </section>

    <section class="max-w-7xl mx-auto px-4 pb-16">
      <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5">
        </div>
    </section>
  </main>

  <footer class="bg-[#070c14] border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
    © 2026 ARMM LIMPIEZA - Catálogo Oficial de Productos Químicos.
  </footer>
