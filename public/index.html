<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMM - Productos y Accesorios de Limpieza</title>
    <style>
        :root {
            --bg-dark: #060913;
            --card-bg: rgba(15, 23, 42, 0.65);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-green: #00e676;
            --text-main: #f8fafc;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0; padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card h4 { margin-bottom: 8px; font-size: 1.1rem; }
        .price-tag { font-size: 1.4rem; color: var(--accent-green); font-weight: bold; margin: 10px 0; }

        select, button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.5);
            color: white;
            margin-top: 5px;
        }

        .btn-add {
            background: var(--accent-green);
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <header>
        <h2>ARMM - Productos de Limpieza</h2>
        <div>
            <button style="width:auto; padding:8px 16px;">Carrito (0)</button>
        </div>
    </header>

    <main class="product-grid" id="publicCatalog"></main>

    <script>
        const socket = io();

        socket.on('inventario_actualizado', (productos) => {
            renderPublicCatalog(productos);
        });

        function renderPublicCatalog(prods) {
            const container = document.getElementById('publicCatalog');
            if(!prods || prods.length === 0) {
                container.innerHTML = '<p>No hay productos disponibles por el momento.</p>';
                return;
            }

            container.innerHTML = prods.map(p => {
                const opciones = p.precios ? Object.keys(p.precios) : [];
                const primeraOpcion = opciones[0] || '';
                const precioInicial = p.precios ? p.precios[primeraOpcion] : 0;

                return `
                    <div class="product-card">
                        <div>
                            <small style="color:var(--accent-green);">${p.categoria || 'General'}</small>
                            <h4>${p.nombre}</h4>
                            
                            ${opciones.length > 0 ? `
                                <label style="font-size:0.8rem;">Presentación:</label>
                                <select onchange="updatePrice(this, ${JSON.stringify(p.precios).replace(/"/g, '&quot;')})">
                                    ${opciones.map(opt => `<option value="${opt}">${opt} - $${p.precios[opt]}</option>`).join('')}
                                </select>
                            ` : ''}

                            <div class="price-tag">$<span class="price-val">${precioInicial}</span></div>
                        </div>

                        <button class="btn-add">Agregar al Carrito</button>
                    </div>
                `;
            }).join('');
        }

        function updatePrice(selectElem, preciosObj) {
            const selectedOpt = selectElem.value;
            const priceVal = preciosObj[selectedOpt];
            const card = selectElem.closest('.product-card');
            card.querySelector('.price-val').innerText = priceVal;
        }
    </script>
</body>
</html>
