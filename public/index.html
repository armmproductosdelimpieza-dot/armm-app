<!-- MODAL DE AUTENTICACIÓN (LOGIN Y REGISTRO) -->
<div id="modalAuth" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
  <div class="glass-apple bg-slate-900/90 border border-slate-700/60 p-6 rounded-3xl max-w-sm w-full space-y-5 relative shadow-2xl">
    
    <button onclick="cerrarModalAuth()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-black btn-apple">✕</button>

    <!-- PESTAÑAS (LOGIN / REGISTRO) -->
    <div class="flex border-b border-slate-800 text-xs font-bold text-slate-400">
      <button id="tabLogin" onclick="cambiarTabAuth('login')" class="flex-1 pb-2 border-b-2 border-emerald-400 text-emerald-400">Iniciar Sesión</button>
      <button id="tabRegistro" onclick="cambiarTabAuth('registro')" class="flex-1 pb-2 border-b-2 border-transparent">Registrarse</button>
    </div>

    <!-- FORMULARIO INICIAR SESIÓN -->
    <form id="formLogin" onsubmit="procesarLogin(event)" class="space-y-4 text-xs">
      <div class="space-y-1">
        <label class="text-[10px] text-slate-400 font-bold uppercase">Correo o Teléfono</label>
        <input type="text" id="loginUsuario" required class="w-full bg-slate-950 border border-slate-800 text-white p-3 rounded-xl focus:outline-none focus:border-emerald-500">
      </div>

      <div class="space-y-1 relative">
        <label class="text-[10px] text-slate-400 font-bold uppercase">Contraseña</label>
        <div class="relative">
          <input type="password" id="loginPass" required class="w-full bg-slate-950 border border-slate-800 text-white p-3 pr-10 rounded-xl focus:outline-none focus:border-emerald-500">
          <button type="button" onclick="togglePasswordVisibility('loginPass', this)" class="absolute right-3 top-2.5 text-slate-400 hover:text-white">👁️</button>
        </div>
      </div>

      <!-- RECUPERAR CONTRASEÑA -->
      <div class="text-right">
        <button type="button" onclick="mostrarOlvidePassword()" class="text-[11px] text-emerald-400 hover:underline">¿Olvidaste tu contraseña?</button>
      </div>

      <button type="submit" class="btn-apple w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl hover:bg-emerald-400 transition-all shadow-lg shadow-emerald-500/20">
        Entrar
      </button>
    </form>

    <!-- FORMULARIO REGISTRO -->
    <form id="formRegistro" onsubmit="procesarRegistro(event)" class="space-y-3 text-xs hidden">
      <div>
        <label class="text-[10px] text-slate-400 font-bold uppercase">Nombre Completo</label>
        <input type="text" id="regNombre" required class="w-full bg-slate-950 border border-slate-800 text-white p-2.5 rounded-xl focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="text-[10px] text-slate-400 font-bold uppercase">Teléfono</label>
        <input type="tel" id="regTel" required class="w-full bg-slate-950 border border-slate-800 text-white p-2.5 rounded-xl focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="text-[10px] text-slate-400 font-bold uppercase">Dirección de Entrega</label>
        <input type="text" id="regDir" required class="w-full bg-slate-950 border border-slate-800 text-white p-2.5 rounded-xl focus:outline-none focus:border-emerald-500">
      </div>

      <div class="relative">
        <label class="text-[10px] text-slate-400 font-bold uppercase">Contraseña</label>
        <div class="relative">
          <input type="password" id="regPass" required class="w-full bg-slate-950 border border-slate-800 text-white p-2.5 pr-10 rounded-xl focus:outline-none focus:border-emerald-500">
          <button type="button" onclick="togglePasswordVisibility('regPass', this)" class="absolute right-3 top-2 text-slate-400 hover:text-white">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-apple w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl hover:bg-emerald-400 transition-all shadow-lg">
        Crear Cuenta
      </button>
    </form>

    <!-- FORMULARIO OLVIDÉ MI CONTRASEÑA -->
    <div id="formOlvidePass" class="space-y-4 text-xs hidden">
      <h4 class="font-bold text-white text-sm">Recuperar Contraseña</h4>
      <p class="text-slate-400 text-[11px]">Ingresa tu número registrado para enviarte un código de acceso a WhatsApp.</p>
      
      <input type="tel" id="recuperarTel" placeholder="Número de WhatsApp" class="w-full bg-slate-950 border border-slate-800 text-white p-3 rounded-xl focus:outline-none focus:border-emerald-500">

      <button type="button" onclick="enviarRecuperacionWhatsApp()" class="btn-apple w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl">
        Solicitar Código por WhatsApp
      </button>

      <button type="button" onclick="volverAlLogin()" class="w-full text-slate-400 text-[11px] text-center hover:underline">
        ← Volver al inicio de sesión
      </button>
    </div>

  </div>
</div>

<!-- MODAL BLOQUEO ADMIN -->
<div id="modalBloqueoAdmin" class="fixed inset-0 bg-slate-950/90 backdrop-blur-lg z-50 hidden flex items-center justify-center p-4">
  <div class="glass-apple bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4 text-center shadow-2xl">
    <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-xl border border-emerald-500/30">
      🔒
    </div>
    <h3 class="font-bold text-white text-base">Acceso Administrador</h3>
    
    <div class="relative text-xs">
      <input type="password" id="adminPassInput" placeholder="Clave de Administrador" class="w-full bg-slate-950 border border-slate-800 text-white p-3 pr-10 rounded-xl focus:outline-none focus:border-emerald-500">
      <button type="button" onclick="togglePasswordVisibility('adminPassInput', this)" class="absolute right-3 top-2.5 text-slate-400 hover:text-white">👁️</button>
    </div>

    <button onclick="validarAccesoAdmin()" class="btn-apple w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl">
      Ingresar al Panel
    </button>
  </div>
</div>

<script>
  // FUNCION PARA CONMUTAR VISIBILIDAD DE CONTRASEÑA (OJITO)
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerText = '🙈';
    } else {
      input.type = 'password';
      btn.innerText = '👁️';
    }
  }

  // CAMBIO DE PESTAÑAS LOGIN / REGISTRO
  function cambiarTabAuth(tab) {
    const fLogin = document.getElementById('formLogin');
    const fReg = document.getElementById('formRegistro');
    const fOlvide = document.getElementById('formOlvidePass');
    const tLogin = document.getElementById('tabLogin');
    const tReg = document.getElementById('tabRegistro');

    fOlvide.classList.add('hidden');

    if (tab === 'login') {
      fLogin.classList.remove('hidden');
      fReg.classList.add('hidden');
      tLogin.className = 'flex-1 pb-2 border-b-2 border-emerald-400 text-emerald-400';
      tReg.className = 'flex-1 pb-2 border-b-2 border-transparent text-slate-400';
    } else {
      fReg.classList.remove('hidden');
      fLogin.classList.add('hidden');
      tReg.className = 'flex-1 pb-2 border-b-2 border-emerald-400 text-emerald-400';
      tLogin.className = 'flex-1 pb-2 border-b-2 border-transparent text-slate-400';
    }
  }

  // MOSTRAR FORMULARIO DE RECUPERACIÓN
  function mostrarOlvidePassword() {
    document.getElementById('formLogin').classList.add('hidden');
    document.getElementById('formRegistro').classList.add('hidden');
    document.getElementById('formOlvidePass').classList.remove('hidden');
  }

  function volverAlLogin() {
    cambiarTabAuth('login');
  }

  function enviarRecuperacionWhatsApp() {
    const tel = document.getElementById('recuperarTel').value.trim();
    if (!tel) return alert('Por favor ingresa tu número de teléfono.');

    const mensaje = `Hola ARMM, solicito recuperar la contraseña asociada a mi número: ${tel}`;
    window.open(`https://wa.me/523351097726?text=${encodeURIComponent(mensaje)}`, '_blank');
  }

  // MODAL CONTROLES
  function abrirModalAuth() { document.getElementById('modalAuth').classList.remove('hidden'); }
  function cerrarModalAuth() { document.getElementById('modalAuth').classList.add('hidden'); }
</script>
