<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARMM Admin - Control de Inventario</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 100%);
      background-attachment: fixed;
    }

    .glass-apple {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-apple {
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-apple:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="text-slate-100 font-sans min-h-screen">

  <!-- MODAL BLOQUEO ACCESO ADMIN CON OJITO -->
  <div id="modalBloqueoAdmin" class="fixed inset-0 bg-slate-950/90 backdrop-blur-lg z-50 flex items-center justify-center p-4">
    <div class="glass-apple bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4 text-center shadow-2xl">
      <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-xl border border-emerald-500/30">
        🔒
      </div>
      <h3 class="font-bold text-white text-base">Acceso Administrador</h3>
      <p class="text-slate-400 text-xs">Ingresa la clave maestra para continuar.</p>
      
      <div class="relative text-xs">
        <input type="password" id="adminPassInput" placeholder="Clave de Administrador" class="w-full bg-slate-950 border border-slate-800 text-white p-3 pr-10 rounded-xl focus:outline-none focus:border-emerald-500">
        <button type="button" onclick="togglePasswordAdmin(this)" class="absolute right-3 top-2.5 text-slate-400 hover:text-white">👁️</button>
      </div>

      <button onclick="validarAccesoAdmin()" class="btn-apple w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl hover:bg-emerald-400 transition-all">
        Ingresar al Panel
      </button>
    </div>
  </div>

  <!-- ENCABEZADO ADMIN -->
  <header class="border-b border-slate-800/80 sticky top-0 glass-apple z-40">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-2xl flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-emerald-500/20">
          A
        </div>
        <h1 class="text-xl font-black text-white">ARMM <span class="text-xs text-emerald-400 font-normal">| Panel Admin</span></h1>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="abrirModalCrear()" class="btn-apple bg-emerald-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-black hover:bg-emerald-400">
          + Nuevo Producto
        </button>
      </div>
    </div>
  </header>

  <!-- TABLA GESTIÓN -->
  <main class="max-w-7xl mx-auto p-6 space-y-6">
    <div class="flex justify-between items-center">
      <h2 class="text-2xl font-black text-white">Catálogo Activo</h2>
      <span id="cantProductos" class="text-xs font-bold bg-slate-800 border border-slate-700 text-emerald-400 px-3 py-1 rounded-full">0 Productos</span>
    </div>

    <div class="glass-apple rounded-3xl border border-slate-800 overflow-hidden shadow-2xl">
      <table class="w-full text-left border-collapse text-xs">
        <thead>
          <tr class="bg-slate-950/60 border-b border-slate-800 text-slate-400 uppercase text-[10px] font-bold tracking-wider">
            <th class="p-4">Producto</th>
            <th class="p-4">Categoría</th>
            <th class="p-4">Precio 1L</th>
            <th class="p-4">Precio 5L</th>
            <th class="p-4">Precio 20L</th>
            <th class="p-4 text-right">Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaAdminProductos" class="divide-y divide-slate-800/60"></tbody>
      </table>
    </div>
  </main>

  <!-- MODAL CREAR / EDITAR PRODUCTO -->
  <div id="modalFormProducto" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-apple bg-slate-900 border border-slate-700/60 p-6 rounded-3xl max-w-md w-full space-y-4 relative">
      <button onclick="cerrarModalForm()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-black btn-apple">✕</button>
      
      <h3 id="lblTituloModalForm" class="text-lg font-black text-white">Crear Producto</h3>

      <form id="formProducto" onsubmit="guardarProducto(event)" class="space-y-3 text-xs">
        <input type="hidden" id="prodId">

        <div>
          <label class="text-[10px] text-slate-400 font-bold uppercase">Nombre del Producto</label>
          <input type="text" id="prodNombre" required class="w-full bg-slate-950 border border-slate-800 text-white p-3 rounded-xl focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="text-[10px] text-slate-400 font-bold uppercase">Categoría</label>
          <input type="text" id="prodCategoria" placeholder="Ej: Aromatizantes" class="w-full bg-slate-950 border border-slate-800 text-white p-3 rounded-xl focus:outline-none focus:border-emerald-500">
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 font-bold uppercase">Precio 1L</label>
            <input type="number" id="p1L" required step="0.01" class="w-full bg-slate-950 border border-slate-800 text-white p-2.5 rounded-xl focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 font-bold uppercase">Precio 5L</label>
            <input type="number" id="p5L" required step="0.01" class="w-full bg-slate-950 border border-slate-800 text-white p-2.5 rounded-xl focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 font-bold uppercase">Precio 20L</label>
            <input type="number" id="p20L" required step="0.01" class="w-full bg-slate-950 border border-slate-800 text-white p-2.5 rounded-xl focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <button type="submit" class="btn-apple w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl hover:bg-emerald-400 transition-all shadow-lg">
          Guardar Cambios
        </button>
      </form>
    </div>
  </div>

  <script>
    const socket = io();
    let listaProductos = [];

    // MOSTRAR/OCULTAR CONTRASEÑA ADMIN (OJITO)
    function togglePasswordAdmin(btn) {
      const input = document.getElementById('adminPassInput');
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = '🙈';
      } else {
        input.type = 'password';
        btn.innerText = '👁️';
      }
    }

    function validarAccesoAdmin() {
      const pass = document.getElementById('adminPassInput').value;
      if (pass === 'armm123') { // Clave de acceso configurable
        document.getElementById('modalBloqueoAdmin').classList.add('hidden');
      } else {
        alert('Clave incorrecta');
      }
    }

    socket.on('inventario_actualizado', data => {
      listaProductos = data;
      renderTablaAdmin();
    });

    function renderTablaAdmin() {
      const tbody = document.getElementById('tablaAdminProductos');
      document.getElementById('cantProductos').innerText = `${listaProductos.length} Productos`;

      if (!listaProductos.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-500">No hay productos registrados.</td></tr>';
        return;
      }

      tbody.innerHTML = listaProductos.map(p => `
        <tr class="hover:bg-slate-800/30">
          <td class="p-4 font-bold text-white">${p.nombre}</td>
          <td class="p-4 text-emerald-400">${p.categoria || 'General'}</td>
          <td class="p-4">$${p.precios['1L'] || 0} MXN</td>
          <td class="p-4">$${p.precios['5L'] || 0} MXN</td>
          <td class="p-4">$${p.precios['20L'] || 0} MXN</td>
          <td class="p-4 text-right space-x-2">
            <button onclick="editarProducto(${p.id})" class="btn-apple bg-blue-500/20 text-blue-400 border border-blue-500/30 px-3 py-1 rounded-lg">Editar</button>
            <button onclick="eliminarProducto(${p.id})" class="btn-apple bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-lg">Eliminar</button>
          </td>
        </tr>
      `).join('');
    }

    function abrirModalCrear() {
      document.getElementById('lblTituloModalForm').innerText = 'Nuevo Producto';
      document.getElementById('prodId').value = '';
      document.getElementById('formProducto').reset();
      document.getElementById('modalFormProducto').classList.remove('hidden');
    }

    function editarProducto(id) {
      const p = listaProductos.find(item => item.id === id);
      if (!p) return;

      document.getElementById('lblTituloModalForm').innerText = 'Editar Producto';
      document.getElementById('prodId').value = p.id;
      document.getElementById('prodNombre').value = p.nombre;
      document.getElementById('prodCategoria').value = p.categoria || '';
      document.getElementById('p1L').value = p.precios['1L'] || 0;
      document.getElementById('p5L').value = p.precios['5L'] || 0;
      document.getElementById('p20L').value = p.precios['20L'] || 0;

      document.getElementById('modalFormProducto').classList.remove('hidden');
    }

    function cerrarModalForm() {
      document.getElementById('modalFormProducto').classList.add('hidden');
    }

    function guardarProducto(e) {
      e.preventDefault();
      const id = document.getElementById('prodId').value;
      const productoData = {
        id: id ? parseInt(id) : Date.now(),
        nombre: document.getElementById('prodNombre').value,
        categoria: document.getElementById('prodCategoria').value,
        precios: {
          '1L': parseFloat(document.getElementById('p1L').value),
          '5L': parseFloat(document.getElementById('p5L').value),
          '20L': parseFloat(document.getElementById('p20L').value)
        }
      };

      socket.emit('guardar_producto', productoData);
      cerrarModalForm();
    }

    function eliminarProducto(id) {
      if (confirm('¿Eliminar este producto permanentemente?')) {
        socket.emit('eliminar_producto', id);
      }
    }
  </script>
</body>
</html>
