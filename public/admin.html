<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMM Admin - Gestión de Catálogo</title>
    <style>
        :root {
            --bg-dark: #060913;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-green: #00e676;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
        }

        .form-control {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-green { background: var(--accent-green); color: #000; }
        .btn-warning { background: var(--warning-color); color: #000; }
        .btn-danger { background: var(--danger-color); color: #fff; }

        .prod-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <h2 style="color:var(--accent-green); margin-bottom: 20px;">Control de Productos ARMM</h2>

        <div class="grid">
            <!-- FORMULARIO ALTA Y EDICIÓN -->
            <div class="card">
                <h3 id="formTitle">Agregar Nuevo Producto</h3>
                <input type="hidden" id="pId">
                
                <label>Nombre del Producto</label>
                <input type="text" id="pName" class="form-control">

                <label>Categoría</label>
                <input type="text" id="pCategory" class="form-control">

                <label>Modo de Venta</label>
                <select id="pSaleMode" class="form-control" onchange="toggleFields()">
                    <option value="litros">Por Litros (1L, 5L, 20L)</option>
                    <option value="mayoreo_menudeo">Mayoreo y Menudeo</option>
                </select>

                <div id="fieldsLitros">
                    <label>Precio 1L ($)</label>
                    <input type="number" id="p1L" class="form-control" step="0.5">
                    <label>Precio 5L ($)</label>
                    <input type="number" id="p5L" class="form-control" step="0.5">
                    <label>Precio 20L ($)</label>
                    <input type="number" id="p20L" class="form-control" step="0.5">
                </div>

                <div id="fieldsMayoreo" style="display:none;">
                    <label>Precio Menudeo ($)</label>
                    <input type="number" id="pMenudeo" class="form-control" step="0.5">
                    <label>Precio Mayoreo ($)</label>
                    <input type="number" id="pMayoreo" class="form-control" step="0.5">
                </div>

                <button class="btn btn-green" style="width:100%; margin-top:10px;" onclick="saveProduct()">Guardar Cambios</button>
                <button class="btn btn-danger" style="width:100%; margin-top:5px;" onclick="resetForm()">Cancelar</button>
            </div>

            <!-- LISTADO CON BOTÓN EDITAR -->
            <div class="card">
                <h3>Catálogo en Vivo (<span id="totalCount">0</span> productos)</h3>
                <div id="productsAdminList" style="max-height: 70vh; overflow-y: auto; margin-top:10px;"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentProducts = [];

        socket.on('inventario_actualizado', (prods) => {
            currentProducts = prods;
            document.getElementById('totalCount').innerText = prods.length;
            renderList(prods);
        });

        function toggleFields() {
            const mode = document.getElementById('pSaleMode').value;
            document.getElementById('fieldsLitros').style.display = mode === 'litros' ? 'block' : 'none';
            document.getElementById('fieldsMayoreo').style.display = mode === 'mayoreo_menudeo' ? 'block' : 'none';
        }

        function saveProduct() {
            const id = document.getElementById('pId').value;
            const name = document.getElementById('pName').value;
            const category = document.getElementById('pCategory').value;
            const mode = document.getElementById('pSaleMode').value;

            if(!name) return alert("Ingresa el nombre del producto.");

            let precios = {};
            if(mode === 'litros') {
                precios["1L"] = parseFloat(document.getElementById('p1L').value) || 0;
                precios["5L"] = parseFloat(document.getElementById('p5L').value) || 0;
                precios["20L"] = parseFloat(document.getElementById('p20L').value) || 0;
            } else {
                precios["Menudeo"] = parseFloat(document.getElementById('pMenudeo').value) || 0;
                precios["Mayoreo"] = parseFloat(document.getElementById('pMayoreo').value) || 0;
            }

            socket.emit('agregar_o_editar_producto', {
                id: id || null,
                nombre: name,
                categoria: category,
                saleMode: mode,
                precios: precios
            });

            resetForm();
        }

        function editProduct(id) {
            const prod = currentProducts.find(p => p.id === id);
            if(!prod) return;

            document.getElementById('formTitle').innerText = 'Editar Producto #' + prod.id;
            document.getElementById('pId').value = prod.id;
            document.getElementById('pName').value = prod.nombre || prod.name || '';
            document.getElementById('pCategory').value = prod.categoria || prod.category || '';
            document.getElementById('pSaleMode').value = prod.saleMode || 'litros';

            toggleFields();

            if(prod.precios) {
                document.getElementById('p1L').value = prod.precios["1L"] || '';
                document.getElementById('p5L').value = prod.precios["5L"] || '';
                document.getElementById('p20L').value = prod.precios["20L"] || '';
                document.getElementById('pMenudeo').value = prod.precios["Menudeo"] || '';
                document.getElementById('pMayoreo').value = prod.precios["Mayoreo"] || '';
            }
        }

        function deleteProduct(id) {
            if(confirm("¿Seguro que deseas eliminar este producto?")) {
                socket.emit('eliminar_producto', id);
            }
        }

        function renderList(prods) {
            const list = document.getElementById('productsAdminList');
            list.innerHTML = prods.map(p => {
                const descPrecio = p.precios ? Object.entries(p.precios).map(([k,v]) => `${k}: $${v}`).join(' | ') : 'Sin Precio';
                return `
                    <div class="prod-row">
                        <div>
                            <strong>${p.nombre || p.name}</strong> <small style="color:var(--text-muted)">(${p.categoria || 'General'})</small>
                            <div style="font-size:0.8rem; color:var(--accent-green); margin-top:2px;">${descPrecio}</div>
                        </div>
                        <div>
                            <button class="btn btn-warning" onclick="editProduct(${p.id})">✏️ Editar</button>
                            <button class="btn btn-danger" onclick="deleteProduct(${p.id})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function resetForm() {
            document.getElementById('formTitle').innerText = 'Agregar Nuevo Producto';
            document.getElementById('pId').value = '';
            document.getElementById('pName').value = '';
            document.getElementById('pCategory').value = '';
            document.getElementById('p1L').value = '';
            document.getElementById('p5L').value = '';
            document.getElementById('p20L').value = '';
            document.getElementById('pMenudeo').value = '';
            document.getElementById('pMayoreo').value = '';
        }
    </script>
</body>
</html>
