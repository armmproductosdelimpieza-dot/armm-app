<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - ARMM</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #0f172a; color: #f8fafc; }
        .login-box, .admin-panel { background: #1e293b; padding: 20px; border-radius: 8px; max-width: 900px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .admin-panel { display: none; }
        .section { margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; box-sizing: border-box; }
        button { background: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #059669; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: left; }
        th { background: #0f172a; }
        .flex-row { display: flex; gap: 10px; }
        .flex-row div { flex: 1; }
    </style>
</head>
<body>

    <!-- Acceso Admin -->
    <div id="loginBox" class="login-box">
        <h2>Acceso Administrador</h2>
        <input type="password" id="adminPass" placeholder="Ingresa contraseña (ARMM123)">
        <button onclick="validarAcceso()">Ingresar</button>
    </div>

    <!-- Panel de Control -->
    <div id="adminPanel" class="admin-panel">
        <h2>Gestión de Productos y Administración ARMM</h2>

        <!-- Formulario Agregar / Editar Producto -->
        <div class="section">
            <h3>Agregar / Editar Producto</h3>
            <form onsubmit="guardarProducto(event)">
                <label>Nombre del Producto</label>
                <input type="text" id="pNombre" required placeholder="Ej. BASE CLORO PARA 20 LTS">

                <label>Categoría</label>
                <input type="text" id="pCategoria" required placeholder="Ej. CLORO / BASES / PINOL">

                <div class="flex-row">
                    <div>
                        <label>Precio 1L ($)</label>
                        <input type="number" id="pPrecio1L" placeholder="18">
                    </div>
                    <div>
                        <label>Precio 5L ($)</label>
                        <input type="number" id="pPrecio5L" placeholder="90">
                    </div>
                    <div>
                        <label>Precio 20L ($)</label>
                        <input type="number" id="pPrecio20L" placeholder="160">
                    </div>
                </div>

                <button type="submit" style="background: #10b981;">Guardar Producto</button>
            </form>

            <h3 style="margin-top: 25px;">Lista de Productos Registrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precios (1L / 5L / 20L)</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos"></tbody>
            </table>
        </div>

        <!-- Centro de Ayuda -->
        <div class="section">
            <h3>Centro de Ayuda (Soporte)</h3>
            <form onsubmit="registrarYEnviarWhatsApp(event)">
                <input type="text" id="helpUser" placeholder="Usuario/Credencial" required>
                <textarea id="helpMsg" placeholder="Escribe el mensaje o problema..." required></textarea>
                <button type="submit">Registrar y Enviar por WhatsApp</button>
            </form>
        </div>

        <!-- Cupones -->
        <div class="section">
            <h3>Gestión de Cupones con Fecha de Expiración</h3>
            <input type="text" placeholder="Código Cupón">
            <input type="number" placeholder="Monto / Descuento">
            <label>Fecha de Expiración (Autodestrucción):</label>
            <input type="date" id="couponExp">
            <button type="button" onclick="alert('Cupón creado con éxito.')">Crear Cupón</button>
        </div>

        <!-- Notificaciones -->
        <div class="section">
            <h3>Notificaciones Individuales</h3>
            <input type="text" id="userFilter" placeholder="Buscar usuario..." onkeyup="filtrarUsuarios()">
            <select id="userSelect" size="3">
                <option value="1">Usuario: Juan Pérez (ID: 101)</option>
                <option value="2">Usuario: María Gómez (ID: 102)</option>
            </select>
            <textarea placeholder="Mensaje de notificación..."></textarea>
            <button type="button" onclick="alert('Notificación enviada.')">Enviar Individual</button>
        </div>
    </div>

    <script>
        const productosIniciales = [
            { nombre: "CLORO", categoria: "CLOROS", precio1L: 14, precio5L: 70, precio20L: 220 },
            { nombre: "CLORO USO INDUSTRIAL", categoria: "CLOROS", precio1L: 18, precio5L: 90, precio20L: 255 },
            { nombre: "PASTILLAS DE CLORO (1KG)", categoria: "CLOROS", precio1L: 0, precio5L: 0, precio20L: 120 },
            { nombre: "PINO (VERDE)", categoria: "PINOL", precio1L: 14, precio5L: 75, precio20L: 190 },
            { nombre: "PINOL C/EXCEDENTE", categoria: "PINOL", precio1L: 22, precio5L: 110, precio20L: 290 },
            { nombre: "PINOL AROMAS", categoria: "PINOL", precio1L: 16, precio5L: 65, precio20L: 160 },
            { nombre: "BASE CLORO USO INDUSTRIAL", categoria: "BASES", precio1L: 0, precio5L: 0, precio20L: 195 },
            { nombre: "BASE CLORO PARA 20 LTS", categoria: "BASES", precio1L: 18, precio5L: 90, precio20L: 160 },
            { nombre: "MULTIUSOS AROMA PERFUME", categoria: "BASES", precio1L: 0, precio5L: 0, precio20L: 180 },
            { nombre: "JABON ROMA BICARBONATO", categoria: "DETERGENTES", precio1L: 24, precio5L: 105, precio20L: 290 },
            { nombre: "SUAVIZANTE DE ROPA NORMAL", categoria: "SUAVIZANTES", precio1L: 24, precio5L: 120, precio20L: 295 },
            { nombre: "JABON PARA MANOS", categoria: "LAVAMANOS", precio1L: 26, precio5L: 130, precio20L: 340 },
            { nombre: "LAVATRASTES", categoria: "LAVATRASTES", precio1L: 29, precio5L: 145, precio20L: 495 },
            { nombre: "DESENGRAZANTE", categoria: "LIMPIEZA PROFUNDA", precio1L: 25, precio5L: 105, precio20L: 380 }
        ];

        function validarAcceso() {
            var pass = document.getElementById('adminPass').value;
            if(pass === 'ARMM123') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                cargarTablaAdmin();
            } else {
                alert('Contraseña incorrecta.');
            }
        }

        function obtenerProductos() {
            let prods = localStorage.getItem('armm_productos');
            if(!prods) {
                localStorage.setItem('armm_productos', JSON.stringify(productosIniciales));
                return productosIniciales;
            }
            return JSON.parse(prods);
        }

        function guardarProducto(e) {
            e.preventDefault();
            let nombre = document.getElementById('pNombre').value;
            let categoria = document.getElementById('pCategoria').value;
            let precio1L = document.getElementById('pPrecio1L').value || 0;
            let precio5L = document.getElementById('pPrecio5L').value || 0;
            let precio20L = document.getElementById('pPrecio20L').value || 0;

            let lista = obtenerProductos();
            lista.push({ nombre, categoria, precio1L, precio5L, precio20L });
            localStorage.setItem('armm_productos', JSON.stringify(lista));

            alert('¡Producto guardado exitosamente!');
            document.getElementById('pNombre').value = '';
            document.getElementById('pCategoria').value = '';
            document.getElementById('pPrecio1L').value = '';
            document.getElementById('pPrecio5L').value = '';
            document.getElementById('pPrecio20L').value = '';
            
            cargarTablaAdmin();
        }

        function eliminarProducto(index) {
            let lista = obtenerProductos();
            lista.splice(index, 1);
            localStorage.setItem('armm_productos', JSON.stringify(lista));
            cargarTablaAdmin();
        }

        function cargarTablaAdmin() {
            let lista = obtenerProductos();
            let tbody = document.getElementById('tablaProductos');
            tbody.innerHTML = '';

            lista.forEach((p, idx) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.nombre}</td>
                    <td>${p.categoria}</td>
                    <td>1L: $${p.precio1L} | 5L: $${p.precio5L} | 20L: $${p.precio20L}</td>
                    <td><button style="background: #ef4444;" onclick="eliminarProducto(${idx})">Eliminar</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function registrarYEnviarWhatsApp(e) {
            e.preventDefault();
            var user = document.getElementById('helpUser').value;
            var msg = document.getElementById('helpMsg').value;
            let text = encodeURIComponent(`Soporte para usuario [${user}]: ${msg}`);
            window.open(`https://wa.me/523351097726?text=${text}`, '_blank');
        }

        function filtrarUsuarios() {
            var filter = document.getElementById('userFilter').value.toLowerCase();
            var options = document.getElementById('userSelect').options;
            for (var i = 0; i < options.length; i++) {
                var txt = options[i].text.toLowerCase();
                options[i].style.display = txt.includes(filter) ? '' : 'none';
            }
        }
    </script>
</body>
</html>
