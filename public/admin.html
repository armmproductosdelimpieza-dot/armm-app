<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #eef2f5; }
        .login-box, .admin-panel { background: white; padding: 20px; border-radius: 5px; max-width: 600px; margin: 0 auto; }
        .admin-panel { display: none; }
        .section { margin-bottom: 25px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .block-item { display: flex; justify-content: space-between; background: #f9f9f9; padding: 10px; margin: 5px 0; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <!-- Acceso Admin -->
    <div id="loginBox" class="login-box">
        <h2>Acceso Administrador</h2>
        <input type="password" id="adminPass" placeholder="Ingresa contraseña">
        <button onclick="validarAcceso()">Ingresar</button>
    </div>

    <!-- Panel de Control -->
    <div id="adminPanel" class="admin-panel">
        <h2>Panel de Control Admin</h2>

        <!-- Modificación de Orden / Bloques -->
        <div class="section">
            <h3>Orden de Bloques / Categorías</h3>
            <div id="blockContainer">
                <div class="block-item" id="block1">
                    <span>Bloque 1: Banners Principales</span>
                    <div>
                        <button onclick="moverBloque('block1', 'up')">▲</button>
                        <button onclick="moverBloque('block1', 'down')">▼</button>
                    </div>
                </div>
                <div class="block-item" id="block2">
                    <span>Bloque 2: Categorías Destacadas</span>
                    <div>
                        <button onclick="moverBloque('block2', 'up')">▲</button>
                        <button onclick="moverBloque('block2', 'down')">▼</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Centro de Ayuda -->
        <div class="section">
            <h3>Centro de Ayuda (Soporte)</h3>
            <form onsubmit="registrarYEnviarWhatsApp(event)">
                <input type="text" id="helpUser" placeholder="Usuario/Credencial" required><br><br>
                <textarea id="helpMsg" placeholder="Escribe el mensaje o problema..." required></textarea><br><br>
                <button type="submit">Registrar y Enviar por WhatsApp</button>
            </form>
        </div>

        <!-- Cupones con Fecha de Expiración -->
        <div class="section">
            <h3>Gestión de Cupones</h3>
            <input type="text" placeholder="Código Cupón"><br><br>
            <input type="number" placeholder="Monto / Descuento"><br><br>
            <label>Fecha de Expiración (Autodestrucción):</label><br>
            <input type="date" id="couponExp"><br><br>
            <button onclick="alert('Cupón creado con éxito con fecha de expiración.')">Crear Cupón</button>
        </div>

        <!-- Notificaciones Individuales y Filtro -->
        <div class="section">
            <h3>Enviar Notificación</h3>
            <input type="text" id="userFilter" placeholder="Buscar usuario..." onkeyup="filtrarUsuarios()"><br><br>
            <select id="userSelect" size="3" style="width: 100%;">
                <option value="1">Usuario: Juan Pérez (ID: 101)</option>
                <option value="2">Usuario: María Gómez (ID: 102)</option>
                <option value="3">Usuario: Carlos López (ID: 103)</option>
            </select><br><br>
            <textarea placeholder="Mensaje de notificación..."></textarea><br><br>
            <button onclick="alert('Notificación enviada al usuario seleccionado.')">Enviar Individual</button>
            <button onclick="alert('Notificación general enviada a todos.')">Enviar a Todos</button>
        </div>
    </div>

    <script>
        function validarAcceso() {
            var pass = document.getElementById('adminPass').value;
            if(pass === 'ARMM123') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                alert('Contraseña incorrecta.');
            }
        }

        function moverBloque(id, dir) {
            var el = document.getElementById(id);
            if (dir === 'up' && el.previousElementSibling) {
                el.parentNode.insertBefore(el, el.previousElementSibling);
            } else if (dir === 'down' && el.nextElementSibling) {
                el.parentNode.insertBefore(el.nextElementSibling, el);
            }
        }

        function registrarYEnviarWhatsApp(e) {
            e.preventDefault();
            var user = document.getElementById('helpUser').value;
            var msg = document.getElementById('helpMsg').value;
            
            // Simulación de registro interno de credenciales en base de datos
            console.log(`Credenciales registradas -> Usuario: ${user}`);
            
            let text = encodeURIComponent(`Soporte para usuario [${user}]: ${msg}`);
            window.open(`https://wa.me/525551234567?text=${text}`, '_blank');
        }

        function filtrarUsuarios() {
            var filter = document.getElementById('userFilter').value.toLowerCase();
            var options = document.getElementById('userSelect').options;
            for (var i = 0; i < options.length; i++) {
                var txt = options[i].text.toLowerCase();
                options[i].style.display = txt.includes(filter) ? '' : 'none';
            }
        }
    </script>
</body>
</html>
