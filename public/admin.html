<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMM — Productos de Limpieza & Jarciería</title>
    <style>
        :root {
            --bg-dark: #060913;
            --card-bg: rgba(15, 23, 42, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-green: #00e676;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background: rgba(6, 9, 19, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-weight: 800;
            font-size: 1.4rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--accent-green); }

        .hero-banner {
            background: linear-gradient(180deg, rgba(0, 230, 118, 0.1) 0%, rgba(6, 9, 19, 1) 100%);
            padding: 40px 5%;
            text-align: center;
        }

        .hero-banner h1 { font-size: 2.2rem; margin-bottom: 10px; }
        .hero-banner p { color: var(--text-muted); max-width: 600px; margin: 0 auto 20px auto; }

        .search-bar {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            color: white;
        }

        .category-filter {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 20px 5%;
            border-bottom: 1px solid var(--border-color);
        }

        .cat-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        .cat-chip.active {
            background: var(--accent-green);
            color: black;
            font-weight: bold;
        }

        .catalog-container {
            padding: 30px 5%;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-green);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #0f172a;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-category { font-size: 0.75rem; color: var(--accent-green); text-transform: uppercase; font-weight: bold; }
        .card-title { font-size: 1.05rem; margin: 5px 0 10px 0; font-weight: 600; }

        .price-val {
            font-size: 1.5rem;
            color: var(--accent-green);
            font-weight: 700;
            margin: 10px 0;
        }

        select, .btn-cart {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.5);
            color: white;
        }

        .btn-cart {
            background: var(--accent-green);
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        .cart-badge {
            background: var(--accent-green);
            color: black;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <header>
        <div class="brand">ARMM <span>LIMPIEZA</span></div>
        <div class="cart-badge" id="cartCount">Carrito (0)</div>
    </header>

    <div class="hero-banner">
        <h1>Catálogo de Productos Químicos y Jarciería</h1>
        <p>Encuentra soluciones de limpieza industrial y hogar a los mejores precios por litro o mayoreo.</p>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar producto (ej. Cloro, Detergente)..." oninput="filterProducts()">
        </div>
    </div>

    <div class="category-filter" id="categoryChips"></div>

    <div class="catalog-container">
        <div class="product-grid" id="publicCatalog"></div>
    </div>

    <script>
        const socket = io();
        let allProducts = [];
        let activeCategory = 'TODOS';
        let cartItemsCount = 0;

        const defaultImages = {
            'Cloros': 'https://images.unsplash.com/photo-1584813470613-5b1c1cad3d69?w=400&q=80',
            'Pinol': 'https://images.unsplash.com/photo-1585421514284-efb74c2b69ba?w=400&q=80',
            'Detergentes': 'https://images.unsplash.com/photo-1610557892470-55d9e80c0bce?w=400&q=80',
            'Jarcería': 'https://images.unsplash.com/photo-1563453392212-326f5e854473?w=400&q=80',
            'Envases': 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=400&q=80'
        };

        socket.on('inventario_actualizado', (productos) => {
            allProducts = productos;
            renderCategories();
            filterProducts();
        });

        function renderCategories() {
            const categories = ['TODOS', ...new Set(allProducts.map(p => p.categoria || 'General'))];
            const chipsContainer = document.getElementById('categoryChips');
            chipsContainer.innerHTML = categories.map(cat => `
                <div class="cat-chip ${cat === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</div>
            `).join('');
        }

        function selectCategory(cat) {
            activeCategory = cat;
            renderCategories();
            filterProducts();
        }

        function filterProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchCat = activeCategory === 'TODOS' || (p.categoria || 'General') === activeCategory;
                const matchSearch = (p.nombre || p.name || '').toLowerCase().includes(search);
                return matchCat && matchSearch;
            });
            renderGrid(filtered);
        }

        function renderGrid(prods) {
            const container = document.getElementById('publicCatalog');
            if(prods.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center; grid-column:1/-1;">No se encontraron productos.</p>';
                return;
            }

            container.innerHTML = prods.map(p => {
                const opciones = p.precios ? Object.keys(p.precios) : [];
                const primeraOpcion = opciones[0] || '';
                const precioInicial = p.precios ? p.precios[primeraOpcion] : 0;
                const imgUrl = p.imagen || defaultImages[p.categoria] || 'https://images.unsplash.com/photo-1585421514284-efb74c2b69ba?w=400&q=80';

                return `
                    <div class="product-card">
                        <img src="${imgUrl}" alt="${p.nombre}">
                        <div class="card-body">
                            <div>
                                <span class="card-category">${p.categoria || 'General'}</span>
                                <h4 class="card-title">${p.nombre}</h4>
                                
                                ${opciones.length > 0 ? `
                                    <label style="font-size:0.8rem; color:var(--text-muted);">Presentación:</label>
                                    <select onchange="updatePrice(this, ${JSON.stringify(p.precios).replace(/"/g, '&quot;')})">
                                        ${opciones.map(opt => `<option value="${opt}">${opt} - $${p.precios[opt]}</option>`).join('')}
                                    </select>
                                ` : ''}

                                <div class="price-val">$<span class="price-holder">${precioInicial}</span></div>
                            </div>

                            <button class="btn-cart" onclick="addToCart()">Agregar al Carrito</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updatePrice(selectElem, preciosObj) {
            const selectedOpt = selectElem.value;
            const priceVal = preciosObj[selectedOpt];
            const card = selectElem.closest('.product-card');
            card.querySelector('.price-holder').innerText = priceVal;
        }

        function addToCart() {
            cartItemsCount++;
            document.getElementById('cartCount').innerText = `Carrito (${cartItemsCount})`;
        }
    </script>
</body>
</html>
