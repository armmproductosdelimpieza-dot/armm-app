<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #0b1329; color: #fff; display: flex; }
        .sidebar { width: 220px; background-color: #0a1122; padding: 20px; min-height: 100vh; }
        .sidebar h2 { color: #00e699; font-size: 1.2em; margin-bottom: 30px; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar li { margin-bottom: 20px; color: #8a99ad; cursor: pointer; }
        .sidebar li.active { color: #00e699; background: #0f2238; padding: 10px; border-radius: 5px; }
        .content { flex: 1; padding: 30px; }
        .content h1 { color: #00e699; margin-top: 0; }
        .card-box { background-color: #101c38; padding: 25px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #1a2b4c; }
        .card-box h3 { margin-top: 0; color: #fff; }
        label { display: block; font-size: 0.85em; color: #8a99ad; margin-bottom: 5px; margin-top: 15px; }
        input, select { width: 100%; padding: 10px; background-color: #070d1d; border: 1px solid #1a2b4c; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .row-3 { display: flex; gap: 15px; }
        .row-3 > div { flex: 1; }
        .btn-green { background-color: #00e699; color: #0b1329; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        .btn-green:hover { background-color: #00c482; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #1a2b4c; }
        th { color: #00e699; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🛡️ Web Admin</h2>
        <ul>
            <li>1. Pedidos Realizados</li>
            <li class="active">2. Gestión de Productos</li>
            <li>3. Usuarios Registrados</li>
            <li>4. Centro de Ayuda</li>
            <li>5. Gestión de Cupones</li>
            <li>6. Generar Notificaciones</li>
        </ul>
    </div>

    <div class="content">
        <h1>Gestión de Productos</h1>

        <div class="card-box">
            <h3>Agregar / Editar Producto</h3>
            <form onsubmit="guardarProducto(event)">
                <label>Nombre</label>
                <input type="text" id="nombre" required>

                <label>Categoría</label>
                <input type="text" id="categoria" required>

                <label>Presentación / Venta</label>
                <select id="presentacion">
                    <option value="Litro (20L, 5L, 1L)">Litro (20L, 5L, 1L)</option>
                    <option value="Pieza">Pieza</option>
                </select>

                <label>Precios por Litro ($)</label>
                <div class="row-3">
                    <div>
                        <label>Precio 1L</label>
                        <input type="number" id="p1">
                    </div>
                    <div>
                        <label>Precio 5L</label>
                        <input type="number" id="p5">
                    </div>
                    <div>
                        <label>Precio 20L</label>
                        <input type="number" id="p20">
                    </div>
                </div>

                <button type="submit" class="btn-green">Guardar Producto</button>
            </form>
        </div>

        <div class="card-box">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio / Opciones</th>
                        <th>Presentación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaAdmin"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Catálogo extraído del Excel
        const productosExcel = [
            {"nombre": "CLORO", "categoria": "CLOROS", "presentacion": "Litro (20L, 5L, 1L)", "p1": 14.0, "p5": 70.0, "p20": 220.0},
            {"nombre": "CLORO USO INDUSTRIAL", "categoria": "CLOROS", "presentacion": "Litro (20L, 5L, 1L)", "p1": 18.0, "p5": 90.0, "p20": 255.0},
            {"nombre": "PASTILLAS DE CLORO", "categoria": "CLOROS", "presentacion": "Litro (20L, 5L, 1L)", "p1": 0, "p5": 0, "p20": 120.0},
            {"nombre": "PINO (VERDE)", "categoria": "PINOL", "presentacion": "Litro (20L, 5L, 1L)", "p1": 14.0, "p5": 75.0, "p20": 190.0},
            {"nombre": "PINOL C/EXCEDENTE", "categoria": "PINOL", "presentacion": "Litro (20L, 5L, 1L)", "p1": 22.0, "p5": 110.0, "p20": 290.0},
            {"nombre": "PINO EXTRA", "categoria": "PINOL", "presentacion": "Litro (20L, 5L, 1L)", "p1": 26.0, "p5": 115.0, "p20": 370.0},
            {"nombre": "PINOL AROMAS", "categoria": "PINOL", "presentacion": "Litro (20L, 5L, 1L)", "p1": 16.0, "p5": 65.0, "p20": 160.0},
            {"nombre": "PINOL AROMAS PLUS", "categoria": "PINOL", "presentacion": "Litro (20L, 5L, 1L)", "p1": 22.0, "p5": 95.0, "p20": 310.0},
            {"nombre": "BASE CLORO USO INDUSTRIAL", "categoria": "BASES", "presentacion": "Litro (20L, 5L, 1L)", "p1": 0, "p5": 0, "p20": 195.0},
            {"nombre": "BASE CLORO PARA 20 LTS", "categoria": "BASES", "presentacion": "Litro (20L, 5L, 1L)", "p1": 18.0, "p5": 90.0, "p20": 160.0},
            {"nombre": "MULTIUSOS AROMA PERFUME", "categoria": "BASES", "presentacion": "Litro (20L, 5L, 1L)", "p1": 0, "p5": 0, "p20": 180.0},
            {"nombre": "MULTIUSOS DOBLE AROMA", "categoria": "BASES", "presentacion": "Litro (20L, 5L, 1L)", "p1": 0, "p5": 0, "p20": 260.0},
            {"nombre": "JABON ROMA BICARBONATO", "categoria": "DETERGENTES", "presentacion": "Litro (20L, 5L, 1L)", "p1": 24.0, "p5": 105.0, "p20": 290.0},
            {"nombre": "SUAVIZANTE DE ROPA NORMAL", "categoria": "SUAVIZANTES", "presentacion": "Litro (20L, 5L, 1L)", "p1": 24.0, "p5": 120.0, "p20": 295.0},
            {"nombre": "JABON PARA MANOS", "categoria": "LAVAMANOS", "presentacion": "Litro (20L, 5L, 1L)", "p1": 26.0, "p5": 130.0, "p20": 340.0},
            {"nombre": "LAVATRASTES", "categoria": "LAVATRASTES", "presentacion": "Litro (20L, 5L, 1L)", "p1": 29.0, "p5": 145.0, "p20": 495.0},
            {"nombre": "DESENGRAZANTE", "categoria": "LIMPIEZA PROFUNDA", "presentacion": "Litro (20L, 5L, 1L)", "p1": 25.0, "p5": 105.0, "p20": 380.0},
            {"nombre": "CAJA HIGIENICO DALIA 180", "categoria": "JARCERÍA", "presentacion": "Pieza", "p1": 0, "p5": 0, "p20": 490.0},
            {"nombre": "TRAPEADOR MICROFIBRA ESPAÑOLA", "categoria": "JARCERÍA", "presentacion": "Pieza", "p1": 115.0, "p5": 0, "p20": 98.0},
            {"nombre": "ESCOBA VENECIANA", "categoria": "JARCERÍA", "presentacion": "Pieza", "p1": 95.5, "p5": 0, "p20": 85.5}
        ];

        function obtenerLista() {
            let p = localStorage.getItem('armm_productos');
            if(!p) {
                localStorage.setItem('armm_productos', JSON.stringify(productosExcel));
                return productosExcel;
            }
            return JSON.parse(p);
        }

        function renderTabla() {
            let lista = obtenerLista();
            let tbody = document.getElementById('tablaAdmin');
            tbody.innerHTML = '';

            lista.forEach((prod, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${prod.nombre}</td>
                    <td>${prod.categoria}</td>
                    <td>1L: $${prod.p1 || '-'} | 5L: $${prod.p5 || '-'} | 20L: $${prod.p20 || '-'}</td>
                    <td>${prod.presentacion}</td>
                    <td><button style="background:red; color:white; border:none; padding:5px 10px; border-radius:3px; cursor:pointer;" onclick="eliminar(${index})">Eliminar</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function guardarProducto(e) {
            e.preventDefault();
            let nuevo = {
                nombre: document.getElementById('nombre').value,
                categoria: document.getElementById('categoria').value,
                presentacion: document.getElementById('presentacion').value,
                p1: document.getElementById('p1').value || 0,
                p5: document.getElementById('p5').value || 0,
                p20: document.getElementById('p20').value || 0
            };

            let lista = obtenerLista();
            lista.push(nuevo);
            localStorage.setItem('armm_productos', JSON.stringify(lista));

            alert('¡Producto guardado e integrado a la Web Pública!');
            document.querySelector('form').reset();
            renderTabla();
        }

        function eliminar(index) {
            let lista = obtenerLista();
            lista.splice(index, 1);
            localStorage.setItem('armm_productos', JSON.stringify(lista));
            renderTabla();
        }

        window.onload = renderTabla;
    </script>
</body>
</html>
