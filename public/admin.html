<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARMM Admin - Gestión de Pedidos</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6">

  <!-- INGRESO ADMIN -->
  <div id="loginAdmin" class="max-w-md mx-auto mt-20 glass-card p-6 rounded-3xl text-center space-y-4">
    <h2 class="text-xl font-bold text-white">Panel Administrador ARMM</h2>
    <input type="password" id="passAdmin" placeholder="Contraseña de Admin" class="w-full bg-slate-900 border border-slate-700 text-white p-2.5 rounded-xl text-xs">
    <button onclick="validarAdmin()" class="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Ingresar</button>
  </div>

  <!-- PANEL -->
  <main id="panelAdmin" class="max-w-7xl mx-auto space-y-8 hidden">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-black text-white">Administración de Pedidos</h1>
        <p class="text-xs text-emerald-400 font-bold">Seguimiento en Tiempo Real</p>
      </div>
      <button onclick="location.reload()" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl">Salir</button>
    </div>

    <section class="space-y-4">
      <h2 class="text-lg font-bold text-white">📦 Lista de Pedidos Entrantes</h2>
      <div id="contenedorPedidosAdmin" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>
  </main>

  <script>
    const socket = io();
    let pedidos = [];

    function validarAdmin() {
      if (document.getElementById('passAdmin').value === 'ARMM123') {
        document.getElementById('loginAdmin').classList.add('hidden');
        document.getElementById('panelAdmin').classList.remove('hidden');
      } else alert('Contraseña incorrecta');
    }

    socket.on('lista_pedidos_inicial', data => { pedidos = data; renderPedidosAdmin(); });

    function renderPedidosAdmin() {
      const container = document.getElementById('contenedorPedidosAdmin');
      if (!pedidos.length) {
        container.innerHTML = '<p class="text-slate-400 text-xs">No hay pedidos registrados.</p>';
        return;
      }

      container.innerHTML = pedidos.map(p => `
        <div class="glass-card p-5 rounded-3xl space-y-3 text-xs text-left">
          <div class="flex justify-between items-center">
            <span class="font-bold text-emerald-400 text-sm">${p.id}</span>
            <span class="text-[10px] text-slate-400">${p.fechaRegistro}</span>
          </div>

          <div class="bg-slate-900/80 p-3 rounded-xl space-y-1 text-slate-300">
            <p><strong class="text-white">Cliente:</strong> ${p.cliente.nombre} ${p.cliente.apellido}</p>
            <p><strong class="text-white">Teléfono:</strong> ${p.cliente.telefono}</p>
            <p><strong class="text-white">Dirección:</strong> ${p.cliente.direccion}</p>
            <p><strong class="text-white">Método Pago:</strong> ${p.metodoPago}</p>
          </div>

          <div class="bg-slate-950 p-3 rounded-xl space-y-1 text-[11px]">
            <p class="font-bold text-white mb-1">Productos:</p>
            ${p.productos.map(i => `<div>• ${i.nombre} (${i.presentacion}) - $${i.precio}</div>`).join('')}
            <p class="font-bold text-emerald-400 mt-2 text-xs">Total: $${p.total} MXN</p>
          </div>

          <div class="space-y-2 border-t border-slate-800 pt-3">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[10px] text-slate-400">Estado:</label>
                <select id="estado-${p.id}" class="w-full bg-slate-900 border border-slate-700 text-white p-2 rounded-xl text-xs">
                  <option value="Leído" ${p.estado === 'Leído' ? 'selected' : ''}>Leído</option>
                  <option value="Preparando" ${p.estado === 'Preparando' ? 'selected' : ''}>Preparando</option>
                  <option value="En camino" ${p.estado === 'En camino' ? 'selected' : ''}>En camino</option>
                  <option value="Entregado" ${p.estado === 'Entregado' ? 'selected' : ''}>Entregado</option>
                </select>
              </div>

              <div>
                <label class="text-[10px] text-slate-400">Fecha Estimada:</label>
                <input type="text" id="fecha-${p.id}" value="${p.fechaEstimada}" placeholder="Ej: Mañana 4:00 PM" class="w-full bg-slate-900 border border-slate-700 text-white p-2 rounded-xl text-xs">
              </div>
            </div>

            <button onclick="guardarCambiosPedido('${p.id}')" class="w-full bg-blue-500/20 text-blue-400 border border-blue-500/30 hover:bg-blue-500 hover:text-white font-bold py-2 rounded-xl text-xs transition-all">
              Actualizar Estado y Notificar
            </button>
          </div>
        </div>
      `).join('');
    }

    function guardarCambiosPedido(pedidoId) {
      const nuevoEstado = document.getElementById(`estado-${pedidoId}`).value;
      const fechaEstimada = document.getElementById(`fecha-${pedidoId}`).value;
      socket.emit('actualizar_estado_pedido', { pedidoId, nuevoEstado, fechaEstimada });
      alert('Pedido actualizado con éxito');
    }
  </script>
</body>
</html>
